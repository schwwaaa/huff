<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Canvas Viewer</title>
  <style>
    html,body{ margin:0; width:100vw; height:100vh; background:#000; overflow:hidden; }
    #mirror{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
    * { user-select:none; }

    .custom-titlebar {
      width: 100%;
      height: 32px;
      background: #333;
      -webkit-app-region: no-drag;
    }
  </style>
</head>
<body>
  <div data-tauri-drag-region class="custom-titlebar">
    <span>huff · canvas mirror</span>
  </div>
  <canvas id="mirror"></canvas>
  <script>
    function qs(name) {
      const q = new URLSearchParams(location.search);
      return q.get(name);
    }

    // If ?ws= is present, use it; otherwise talk to our fixed relay port.
    const wsURL  = qs('ws') || 'ws://127.0.0.1:8787';
    const autofs = qs('autofs') === '1';

    const cvs = document.getElementById('mirror');
    // Keep the backing store at the encoded frame's native dimensions and let
    // CSS/GPU composition scale it to the output window. The old viewer resized
    // its backing canvas to the full display (and up to 2× DPR), forcing every
    // 1280px mirror frame to be redrawn into a multi-megapixel surface.
    const bitmapCtx = cvs.getContext('bitmaprenderer');
    const ctx = bitmapCtx ? null : cvs.getContext('2d', { alpha:false, desynchronized:true });
    cvs.width = 1;
    cvs.height = 1;

    function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    async function goFullscreen(){
      try{
        const el = document.documentElement;
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
      }catch(e){}
    }
    function toggleFS(){
      if (isFullscreen()) {
        const ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) ex.call(document);
      } else {
        goFullscreen();
      }
    }
    document.addEventListener('dblclick', toggleFS);
    document.addEventListener('keydown', e => { if (e.key==='f' || e.key==='F') toggleFS(); });
    if (autofs) setTimeout(()=>{ goFullscreen(); }, 120);

// ── WebSocket with exponential-backoff reconnect ─────────────────────────
let ws;
let _wsDelay = 1000; // start at 1 s, doubles up to 16 s
const WS_DELAY_MAX = 16000;

function connectWS() {
  ws = new WebSocket(wsURL);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    console.log('[canvas ws] connected to', wsURL);
    _wsDelay = 1000; // reset backoff on successful connection
    try { ws.send(JSON.stringify({ type:'hello', role:'canvas' })); } catch(e) { console.error(e); }
  };

  ws.onerror = (ev) => {
    console.error('[canvas ws] error', ev);
  };

  ws.onclose = (ev) => {
    console.warn('[canvas ws] closed', ev.code, ev.reason, `— reconnecting in ${_wsDelay}ms`);
    setTimeout(() => {
      _wsDelay = Math.min(_wsDelay * 2, WS_DELAY_MAX);
      connectWS();
    }, _wsDelay);
  };

  // Latest-frame-wins. The previous handler decoded and drew EVERY frame it
  // received, so when decode+draw fell behind the incoming rate (more likely at
  // 1080p / 60fps) frames accumulated and were shown stale — a latency tail that
  // grew while streaming and kept draining after the sender stopped. Instead we
  // keep only the newest received frame and run at most one decode at a time;
  // any frames that arrive mid-decode overwrite the pending one and the stale
  // ones are dropped. Latency is bounded to a single decode+draw, and on stop
  // there is at most one frame left to render — no tail.
  let _pending = null;     // newest received frame bytes not yet rendered
  let _busy    = false;    // a decode/draw is currently in flight

  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') return;
    _pending = ev.data;    // drop any older undrawn frame — only the newest matters
    if (!_busy) drainPending();
  };

  function drainPending() {
    if (_busy || _pending == null) return;
    _busy = true;
    const data = _pending;
    _pending = null;
    let blob;
    try { blob = new Blob([data]); }
    catch (e) { _busy = false; return; }
    createImageBitmap(blob, { imageOrientation:'none', premultiplyAlpha:'premultiply' })
      .then(bmp => {
        if (cvs.width !== bmp.width || cvs.height !== bmp.height) {
          cvs.width = bmp.width;
          cvs.height = bmp.height;
        }
        if (bitmapCtx) {
          bitmapCtx.transferFromImageBitmap(bmp);
          // transferFromImageBitmap consumes the bitmap; close is harmless and
          // also protects WebViews whose implementation retains ownership.
          bmp.close?.();
        } else {
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'copy';
          ctx.drawImage(bmp, 0, 0);
          ctx.globalCompositeOperation = 'source-over';
          bmp.close?.();
        }
      })
      .catch(e => { console.warn('[canvas ws] bad frame', e); })
      .finally(() => {
        _busy = false;
        // A newer frame landed while we were decoding — render it next, dropping
        // everything that arrived before it.
        if (_pending != null) drainPending();
      });
  }
}

connectWS();
  </script>
</body>
</html>
