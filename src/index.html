<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>huff</title>
    <link rel="icon" href="../src-tauri/icons/icon.png">
    <style>
         :root {
            color-scheme: dark;
        }
        
        html,
        body {
            margin: 0;
            height: 100%;
            background: black;
            color: #e8eaf0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial
        }
        
        canvas {
            position: fixed;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            display: block
        }
        
        header {
            position: fixed;
            top: 8px;
            left: 8px;
            right: 8px;
            z-index: 10;
            padding: 10px;
            border: 2px solid black;
            background: #ff4646;
            /* background: rgba(18, 21, 28, .92); */
            border-radius: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            backdrop-filter: blur(6px)
        }
        
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }
        
        .control {
            background: black;
            border: 2px solid white;
            padding: 6px 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px
        }
        
        .control2 {
            background: white;
            border: 2px solid #1c2030;
            color: black;
            padding: 6px 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        
        .control label {
            font-size: 12px;
            color: white;
        }
        
        input[type=range],
        input[type=number],
        select {
            width: 120px;
            background-color: black;
            /* Default background color */
            color: white;
        }
        
        .pill {
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid #1c2030;
            background: #151922
        }
        
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }
        
        .muted {
            opacity: .75
        }
        
        button {
            cursor: pointer
        }
    </style>

    <!-- Keep HTML as source of truth & stop Enter from refreshing -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('controlsForm');
            if (!form) return;

            form.reset(); // use HTML defaults
            form.addEventListener('submit', e => e.preventDefault());
            form.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement)) {
                    e.preventDefault();
                    e.target.blur(); // commit value without reloading
                }
            });
        });
    </script>
<style id="ws-mirror-style">
  :root { color-scheme: dark; }
  .pill{ position:fixed; top:8px; right:8px; z-index:9999; background:#151922; color:#e8eaf0;
         border:1px solid #1c2030; border-radius:999px; padding:6px 10px; font:12px ui-sans-serif,system-ui; }
  #openCanvasBtn{ position:fixed; top:8px; right:122px; z-index:9999; background:#202434; color:#e8eaf0;
         border:1px solid #1c2030; border-radius:8px; padding:6px 10px; font:12px ui-sans-serif,system-ui; cursor:pointer; }
</style>

<script>
  // Optional: force a specific relay URL
  // window.WS_MIRROR_URL = 'ws://127.0.0.1:8787';
  function __getWSURL__(port=8787){
    const isSecure = location.protocol === 'https:';
    const proto = isSecure ? 'wss://' : 'ws://';
    const host  = location.hostname || '127.0.0.1';
    return (window.WS_MIRROR_URL || (proto + host + ':' + port));
  }
</script>

</head>

<body>
    <header>
        <!-- File input -->
        <label class="control">
      <input id="file" type="file" accept="video/*">
        <!-- Transport -->
        <button id="playBtn" disabled>Play</button>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="recBtn" disabled>● Record</button>
        <button id="refreshBtn" disabled>↻ Refresh</button>
    </label>

        <!-- Camera controls (added) -->
        <label class="control">
          <button id="camStartBtn" class="control2">Start Camera</button>
          <button id="camStopBtn"  class="control2">Stop Cam</button>
          <button id="camRefreshBtn" class="control2">Refresh Cams</button>
          <span class="row">
            <span>Camera</span>
            <select id="cams"></select>
          </span>
        </label>

        <!-- EFFECT CONTROLS (HTML owns the defaults) -->
        <form id="controlsForm" class="controls" autocomplete="off" novalidate>
            <div class="control"><label>SYSTEM</label><input id="corruptOn" type="checkbox"></div>
            <!-- Quality -->


            <!-- Core -->

            <div class="control"><label>QUALITY</label>
                <input id="quality" type="range" min="0" max="3.00" step="0.05" value="1.00">
                <span id="qualityVal">1.00</span>
            </div>
            <div class="control"><label>DEPTH</label><input id="depth" type="range" min="0" max="0.3" step="0.01" value="0.5"><span id="depthVal">0.50</span></div>
            <div class="control"><label>CORRUPT %</label><input id="corrupt" type="range" min="0" max="1" step="0.01" value="0.30"><span id="corruptVal">0.30</span></div>
            <div class="control"><label>PIXEL SIZE</label><input id="block" type="range" min="4" max="2000" step="2" value="1000"><span id="blockVal">32</span></div>

            <!-- Cadence -->
            <div class="control"><label>GLITCH SPEED</label><input id="glitchSpeed" type="range" min="0.005" max="5" step="0.005" value="0.8"><span id="glitchSpeedVal">0.80</span></div>
            <div class="control"><label>FINE SPEED</label><input id="glitchSpeedFine" type="range" min="0.001" max="10" step="0.001" value="1.00"><span id="glitchSpeedFineVal">1.00</span></div>
            <div class="control"><label>GLITCH SIZE</label><input id="glitchSize" type="range" min="1" max="60" step="0.01" value="10"><span id="glitchSizeVal">20</span></div>
            <div class="control"><label>GLITCH SMEAR</label><input id="glitchSmear" type="range" min="0" max="20" step="1" value="6"><span id="glitchSmearVal">6</span></div>

            <!-- Determinism -->
            <div class="control"><label>SEED</label><input id="seed" type="number" value="912831" step="1"></div>

            <!-- Buffer evolution -->
            <div class="control2"><label>FEEDBACK</label><input id="feedback" type="range" min="0" max="3" step="0.05" value="0.6"><span id="feedbackVal">0.60</span></div>
            <div class="control2"><label>PERSISTENCE</label><input id="persistence" type="range" min="0" max="10" step="0.05" value="0.7"><span id="persistenceVal">0.70</span></div>

            <!-- Feedback XYZ + θ -->
            <div class="control"><label>FB X</label><input id="fbX" type="range" min="-50" max="50" step="1" value="1"><span id="fbXVal">1</span></div>
            <div class="control"><label>FB Y</label><input id="fbY" type="range" min="-50" max="50" step="1" value="1"><span id="fbYVal">1</span></div>
            <div class="control"><label>FB Z</label><input id="fbZ" type="range" min="0.90" max="1.10" step="0.005" value="1.000"><span id="fbZVal">1.00</span></div>
            <div class="control"><label>FB θ</label><input id="fbTheta" type="range" min="-180" max="180" step="1" value="0"><span id="fbThetaVal">0</span></div>

            <!-- Auto FB + sub-toggles -->
            <div class="control"><label>FB Auto</label><input id="fbAuto" type="checkbox"></div>
            <div class="control"><label>SPEED</label><input id="fbSpeed" type="range" min="0.01" max="10" step="0.01" value="0.50"><span id="fbSpeedVal">0.50</span></div>
            <div class="control"><label>MV X</label><input id="fbMoveX" type="checkbox"></div>
            <div class="control"><label>MV Y</label><input id="fbMoveY" type="checkbox"></div>
            <div class="control"><label>MV Z</label><input id="fbMoveZ" type="checkbox"></div>
            <div class="control"><label>ROTATE</label><input id="fbMoveTheta" type="checkbox"></div>

            <!-- Spatialization + clusters -->
            <div class="control"><label>CLUSTERS</label><input id="clusters" type="checkbox"></div>
            <div class="control"><label>COUNT</label><input id="clusterCount" type="range" min="1" max="50" step="1" value="3"><span id="clusterCountVal">3</span></div>
            <div class="control"><label>RADIUS</label><input id="clusterRadius" type="range" min="1" max="20" step="0.01" value="10"><span id="clusterRadiusVal">120</span></div>
            <div class="control"><label>SPATIAL GAP</label><input id="spatialGap" type="range" min="0" max="200" step="1" value="40"><span id="spatialGapVal">40</span></div>


            <!-- Cycle + bursts -->
            <div class="control"><label>CYCLE</label><input id="cycleOn" type="checkbox"></div>
            <div class="control">
                <label>SHAPE</label>
                <select id="cycleShape">
          <option value="square">SQUARE</option>
          <option value="sine" selected>SINE</option>
        </select>
            </div>
            <div class="control"><label>BURST</label><input id="burstOn" type="checkbox"></div>
            <div class="control"><label>LENGTH</label><input id="burstLen" type="range" min="0.2" max="5" step="0.01" value="2"><span id="burstLenVal">2.0</span></div>
            <div class="control"><label>GAPS</label><input id="burstGap" type="range" min="0.2" max="5" step="0.01" value="1"><span id="burstGapVal">3.0</span></div>
            <div class="control"><label>BOOST</label><input id="burstBoost" type="range" min="1" max="10" step="0.01" value="3"><span id="burstBoostVal">3.0</span></div>

            <!-- Bloom -->
            <div class="control"><label>Bloom on</label><input id="bloomOn" type="checkbox"></div>
            <div class="control"><label>Bloom strength</label><input id="bloomStrength" type="range" min="0" max="2" step="0.05" value="0.8"><span id="bloomStrengthVal">0.80</span></div>
            <div class="control"><label>Bloom radius</label><input id="bloomRadius" type="range" min="1" max="20" step="1" value="8"><span id="bloomRadiusVal">8</span></div>

            <!-- Flow -->
            <div class="control"><label>FLOW</label><input id="flowOn" type="checkbox"></div>
            <div class="control"><label>STRENGTH</label><input id="flowStrength" type="range" min="0" max="20" step="1" value="6"><span id="flowStrengthVal">6</span></div>
            <div class="control"><label>SCALE</label><input id="flowScale" type="range" min="20" max="200" step="5" value="80"><span id="flowScaleVal">80</span></div>

            <!-- Base video -->
            <div class="control"><label>BASE VIDEO</label><input id="baseOn" type="checkbox" checked></div>
            <div class="control"><label>BASE MIX</label><input id="baseMix" type="range" min="0" max="1" step="0.05" value="1.00"><span id="baseMixVal">1.00</span></div>

            <!-- Keep these OFF by default -->
            <div class="control"><label>Seed on load</label><input id="seedOnLoad" type="checkbox" checked></div>

            <!-- Colorizer -->
            <div class="control"><label>COLORIZER</label><input id="colOn" type="checkbox"></div>
            <div class="control"><label>HUE</label><input id="colHue" type="range" min="-180" max="180" step="1" value="20"><span id="colHueVal">20</span></div>
            <div class="control"><label>SAT</label><input id="colSat" type="range" min="0" max="2" step="0.01" value="1.10"><span id="colSatVal">1.10</span></div>
        </form>
    </header>

<!-- <button id="openCanvasBtn" type="button" title="Open mirrored canvas window">Open Canvas Window</button> -->
<span class="pill" id="status">WS: …</span>




<script defer src="p5.js"></script>
<script defer src="effects.js"></script>
<script defer src="canvas.js"></script>
<!-- <script defer src="ws-mirror.js"></script> -->

</body>

</html>
