<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', 'Fira Code', monospace">
  <defs>
    <marker id="a3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgba(255,255,255,0.4)"/>
    </marker>
    <marker id="a3r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ff4444"/>
    </marker>
    <marker id="a3p" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgba(180,100,255,0.8)"/>
    </marker>
    <marker id="a3c" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgba(0,200,220,0.8)"/>
    </marker>
  </defs>

  <rect width="720" height="360" fill="#0d0d0f" rx="12"/>
  <text x="360" y="30" text-anchor="middle" fill="#ff4444" font-size="13" font-weight="700" letter-spacing="2">FRAME OUTPUT PIPELINE</text>

  <!-- gBuf -->
  <rect x="260" y="50" width="200" height="48" rx="6" fill="rgba(255,68,68,0.12)" stroke="#ff4444" stroke-width="1.5"/>
  <text x="360" y="70" text-anchor="middle" fill="#ff4444" font-size="11" font-weight="700">p5 gBuf</text>
  <text x="360" y="87" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="9">composited output canvas</text>

  <!-- 4 output branches -->
  <!-- Branch arrows -->
  <line x1="310" y1="98" x2="100" y2="140" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" marker-end="url(#a3)"/>
  <line x1="345" y1="98" x2="260" y2="140" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" marker-end="url(#a3)"/>
  <line x1="390" y1="98" x2="460" y2="140" stroke="rgba(180,100,255,0.7)" stroke-width="1.5" marker-end="url(#a3p)"/>
  <line x1="420" y1="98" x2="620" y2="140" stroke="rgba(0,200,220,0.7)" stroke-width="1.5" marker-end="url(#a3c)"/>

  <!-- OUTPUT 1: Screen preview -->
  <rect x="20" y="140" width="160" height="50" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="100" y="161" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-weight="700">SCREEN PREVIEW</text>
  <text x="100" y="178" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="8.5">controls window · direct draw</text>

  <!-- OUTPUT 2: WS Mirror -->
  <rect x="200" y="140" width="160" height="50" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="280" y="158" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-weight="700">WS MIRROR</text>
  <text x="280" y="172" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="8.5">JPEG encode → port 8787</text>
  <text x="280" y="184" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="8">canvas.html receives</text>

  <!-- OUTPUT 3: Syphon -->
  <rect x="380" y="140" width="160" height="50" rx="5" fill="rgba(180,100,255,0.08)" stroke="rgba(180,100,255,0.4)" stroke-width="1"/>
  <text x="460" y="158" text-anchor="middle" fill="rgba(180,100,255,0.9)" font-size="10" font-weight="700">SYPHON</text>
  <text x="460" y="172" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="8.5">macOS · HUFFSYPH prefix</text>
  <text x="460" y="184" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="8">port 8787 → Rust intercept</text>

  <!-- OUTPUT 4: Spout -->
  <rect x="560" y="140" width="140" height="50" rx="5" fill="rgba(0,200,220,0.06)" stroke="rgba(0,200,220,0.4)" stroke-width="1"/>
  <text x="630" y="158" text-anchor="middle" fill="rgba(0,200,220,0.9)" font-size="10" font-weight="700">SPOUT</text>
  <text x="630" y="172" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="8.5">Windows · HUFFSPOUT prefix</text>
  <text x="630" y="184" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="8">port 8787 → Rust intercept</text>

  <!-- Syphon detailed path -->
  <line x1="460" y1="190" x2="460" y2="225" stroke="rgba(180,100,255,0.5)" stroke-width="1" marker-end="url(#a3p)"/>
  <rect x="380" y="225" width="160" height="60" rx="5" fill="rgba(180,100,255,0.05)" stroke="rgba(180,100,255,0.2)" stroke-width="1"/>
  <text x="460" y="243" text-anchor="middle" fill="rgba(180,100,255,0.7)" font-size="9" font-weight="700">syphon::push_frame()</text>
  <text x="460" y="257" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="8">MTLTexture CPU upload</text>
  <text x="460" y="269" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="8">SyphonMetalServer</text>
  <text x="460" y="282" text-anchor="middle" fill="rgba(255,255,255,0.18)" font-size="7.5">→ Resolume · VDMX · MadMapper ···</text>

  <!-- Spout detailed path -->
  <line x1="630" y1="190" x2="630" y2="225" stroke="rgba(0,200,220,0.5)" stroke-width="1" marker-end="url(#a3c)"/>
  <rect x="555" y="225" width="150" height="60" rx="5" fill="rgba(0,200,220,0.04)" stroke="rgba(0,200,220,0.2)" stroke-width="1"/>
  <text x="630" y="243" text-anchor="middle" fill="rgba(0,200,220,0.7)" font-size="9" font-weight="700">spout::push_frame()</text>
  <text x="630" y="257" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="8">spoutdx_send_image()</text>
  <text x="630" y="269" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="8">D3D11 UpdateSubresource</text>
  <text x="630" y="282" text-anchor="middle" fill="rgba(255,255,255,0.18)" font-size="7.5">→ Resolume · TouchDesigner ···</text>

  <!-- CPU roundtrip annotation -->
  <rect x="20" y="305" width="340" height="42" rx="5" fill="rgba(255,170,0,0.06)" stroke="rgba(255,170,0,0.25)" stroke-width="1"/>
  <text x="190" y="322" text-anchor="middle" fill="rgba(255,170,0,0.8)" font-size="9" font-weight="700">⚠  CPU ROUND-TRIP  (Syphon + Spout)</text>
  <text x="190" y="337" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="8">getImageData() → WS → Rust → GPU  ·  throttled to configured FPS cap</text>

  <!-- Shared WS label -->
  <text x="360" y="118" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="8">all three routes use port 8787  ·  magic-byte prefix distinguishes them</text>
</svg>
