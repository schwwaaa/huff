<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', 'Fira Code', monospace">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ff4444"/>
    </marker>
    <marker id="arr-dim" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgba(255,255,255,0.25)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="520" fill="#0d0d0f" rx="12"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" fill="#ff4444" font-size="13" font-weight="700" letter-spacing="2">EFFECT PIPELINE — PER FRAME</text>

  <!-- SOURCE box -->
  <rect x="260" y="50" width="240" height="48" rx="6" fill="rgba(255,68,68,0.12)" stroke="#ff4444" stroke-width="1.5"/>
  <text x="380" y="70" text-anchor="middle" fill="#ff4444" font-size="11" font-weight="700" letter-spacing="1">SOURCE</text>
  <text x="380" y="87" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="9.5">video file  ·  webcam  ·  ring seed</text>

  <!-- Arrow source → ring -->
  <line x1="380" y1="98" x2="380" y2="122" stroke="#ff4444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- FRAME RING -->
  <rect x="200" y="122" width="360" height="56" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="380" y="143" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-weight="700" letter-spacing="1">FRAME RING BUFFER</text>
  <text x="380" y="161" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="9">192 MB cap  ·  up to 60 frames  ·  ImageData[]</text>

  <!-- Ring frame labels -->
  <text x="215" y="198" fill="rgba(255,255,255,0.25)" font-size="9">[t-1]</text>
  <text x="255" y="198" fill="rgba(255,255,255,0.2)" font-size="9">[t-2]</text>
  <text x="295" y="198" fill="rgba(255,255,255,0.15)" font-size="9">[t-3]</text>
  <text x="330" y="198" fill="rgba(255,255,255,0.1)" font-size="9">···</text>
  <text x="363" y="198" fill="rgba(255,255,255,0.08)" font-size="9">[t-N]</text>

  <!-- Effect passes — 7 boxes in two rows -->
  <!-- Row 1: Trails, Feedback, Glitch, Scanlines -->
  <!-- Pass arrows from ring -->
  <line x1="380" y1="178" x2="380" y2="220" stroke="rgba(255,255,255,0.15)" stroke-width="1" marker-end="url(#arr-dim)"/>

  <!-- PASS 1 TRAILS -->
  <rect x="30" y="218" width="140" height="42" rx="5" fill="rgba(180,100,255,0.1)" stroke="rgba(180,100,255,0.4)" stroke-width="1"/>
  <text x="100" y="234" text-anchor="middle" fill="rgba(180,100,255,0.9)" font-size="9.5" font-weight="700" letter-spacing="0.5">PASS 1 · TRAILS</text>
  <text x="100" y="249" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8.5">ghost frames composited</text>

  <!-- PASS 2 FEEDBACK -->
  <rect x="188" y="218" width="140" height="42" rx="5" fill="rgba(68,136,255,0.1)" stroke="rgba(68,136,255,0.4)" stroke-width="1"/>
  <text x="258" y="234" text-anchor="middle" fill="rgba(68,136,255,0.9)" font-size="9.5" font-weight="700" letter-spacing="0.5">PASS 2 · FEEDBACK</text>
  <text x="258" y="249" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8.5">zoom / translate / rotate</text>

  <!-- PASS 3 GLITCH -->
  <rect x="346" y="218" width="140" height="42" rx="5" fill="rgba(255,68,68,0.12)" stroke="rgba(255,68,68,0.5)" stroke-width="1"/>
  <text x="416" y="234" text-anchor="middle" fill="#ff4444" font-size="9.5" font-weight="700" letter-spacing="0.5">PASS 3 · GLITCH</text>
  <text x="416" y="249" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8.5">tile displacement from ring</text>

  <!-- PASS 4 SCANLINES -->
  <rect x="504" y="218" width="140" height="42" rx="5" fill="rgba(255,170,0,0.1)" stroke="rgba(255,170,0,0.4)" stroke-width="1"/>
  <text x="574" y="234" text-anchor="middle" fill="rgba(255,170,0,0.9)" font-size="9.5" font-weight="700" letter-spacing="0.5">PASS 4 · SCANLINES</text>
  <text x="574" y="249" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8.5">horizontal band displacement</text>

  <!-- Row connector arrows (pass 1→2→3→4) -->
  <line x1="170" y1="239" x2="188" y2="239" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arr-dim)"/>
  <line x1="328" y1="239" x2="346" y2="239" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arr-dim)"/>
  <line x1="486" y1="239" x2="504" y2="239" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arr-dim)"/>

  <!-- Row 2: Flow Warp, Solarize, Symmetry -->
  <!-- Turn arrow row1 → row2 -->
  <line x1="644" y1="239" x2="674" y2="239" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="674" y1="239" x2="674" y2="310" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="674" y1="310" x2="506" y2="310" stroke="rgba(255,255,255,0.15)" stroke-width="1" marker-end="url(#arr-dim)"/>

  <!-- PASS 5 FLOW WARP -->
  <rect x="346" y="290" width="160" height="42" rx="5" fill="rgba(0,200,220,0.08)" stroke="rgba(0,200,220,0.4)" stroke-width="1"/>
  <text x="426" y="306" text-anchor="middle" fill="rgba(0,200,220,0.9)" font-size="9.5" font-weight="700" letter-spacing="0.5">PASS 5 · FLOW WARP</text>
  <text x="426" y="321" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8.5">noise UV distortion</text>

  <!-- PASS 6 SOLARIZE -->
  <rect x="178" y="290" width="160" height="42" rx="5" fill="rgba(255,220,80,0.08)" stroke="rgba(255,220,80,0.4)" stroke-width="1"/>
  <text x="258" y="306" text-anchor="middle" fill="rgba(255,220,80,0.9)" font-size="9.5" font-weight="700" letter-spacing="0.5">PASS 6 · SOLARIZE</text>
  <text x="258" y="321" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8.5">luma-threshold inversion</text>

  <!-- PASS 7 SYMMETRY -->
  <rect x="10" y="290" width="160" height="42" rx="5" fill="rgba(80,255,140,0.08)" stroke="rgba(80,255,140,0.35)" stroke-width="1"/>
  <text x="90" y="306" text-anchor="middle" fill="rgba(80,255,140,0.85)" font-size="9.5" font-weight="700" letter-spacing="0.5">PASS 7 · SYMMETRY</text>
  <text x="90" y="321" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8.5">mirror fold at axis</text>

  <!-- Row 2 connector arrows -->
  <line x1="346" y1="311" x2="338" y2="311" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arr-dim)"/>
  <line x1="178" y1="311" x2="170" y2="311" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arr-dim)"/>

  <!-- Arrow pass 7 → output -->
  <line x1="90" y1="332" x2="90" y2="380" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="90" y1="380" x2="380" y2="380" stroke="rgba(255,255,255,0.15)" stroke-width="1" marker-end="url(#arr-dim)"/>

  <!-- OUTPUT FRAME box -->
  <rect x="240" y="378" width="280" height="48" rx="6" fill="rgba(255,68,68,0.12)" stroke="#ff4444" stroke-width="1.5"/>
  <text x="380" y="397" text-anchor="middle" fill="#ff4444" font-size="11" font-weight="700" letter-spacing="1">OUTPUT FRAME</text>
  <text x="380" y="413" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="9">→ Canvas window  · Syphon  · Spout  · WS relay</text>

  <!-- Ring update arrow -->
  <line x1="380" y1="426" x2="380" y2="454" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-dim)"/>
  <text x="380" y="468" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="9">pushed to ring → becomes [t-1] next frame</text>

  <!-- Ring read arrows (dashed lines from ring to effect boxes) -->
  <line x1="245" y1="178" x2="100" y2="218" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="290" y1="178" x2="258" y2="218" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="380" y1="178" x2="416" y2="218" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="460" y1="178" x2="574" y2="218" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="380" y1="178" x2="426" y2="290" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Legend -->
  <rect x="490" y="450" width="255" height="58" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="500" y="467" fill="rgba(255,255,255,0.5)" font-size="9" font-weight="700" letter-spacing="1">LEGEND</text>
  <line x1="500" y1="478" x2="520" y2="478" stroke="#ff4444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="525" y="481" fill="rgba(255,255,255,0.4)" font-size="9">main data flow</text>
  <line x1="500" y1="494" x2="520" y2="494" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="525" y="497" fill="rgba(255,255,255,0.4)" font-size="9">ring read (past frames)</text>
</svg>
