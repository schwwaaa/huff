<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', 'Fira Code', monospace">
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ff4444"/>
    </marker>
    <marker id="a2b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgba(180,100,255,0.8)"/>
    </marker>
    <marker id="a2c" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgba(0,200,220,0.8)"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#0d0d0f" rx="12"/>
  <text x="360" y="30" text-anchor="middle" fill="#ff4444" font-size="13" font-weight="700" letter-spacing="2">UI → EFFECT DATA FLOW</text>

  <!-- INPUT SOURCES row -->
  <!-- Slider -->
  <rect x="30" y="55" width="140" height="50" rx="5" fill="rgba(255,68,68,0.1)" stroke="rgba(255,68,68,0.4)" stroke-width="1"/>
  <text x="100" y="75" text-anchor="middle" fill="rgba(255,68,68,0.9)" font-size="10" font-weight="700">SLIDER / TOGGLE</text>
  <text x="100" y="91" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8.5">controls window (WebView)</text>

  <!-- MIDI -->
  <rect x="200" y="55" width="140" height="50" rx="5" fill="rgba(180,100,255,0.1)" stroke="rgba(180,100,255,0.4)" stroke-width="1"/>
  <text x="270" y="72" text-anchor="middle" fill="rgba(180,100,255,0.9)" font-size="10" font-weight="700">MIDI CC</text>
  <text x="270" y="86" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8.5">USB controller / IAC Bus</text>
  <text x="270" y="98" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="8">midir (Rust native)</text>

  <!-- OSC -->
  <rect x="370" y="55" width="140" height="50" rx="5" fill="rgba(0,200,220,0.08)" stroke="rgba(0,200,220,0.4)" stroke-width="1"/>
  <text x="440" y="72" text-anchor="middle" fill="rgba(0,200,220,0.9)" font-size="10" font-weight="700">OSC MESSAGE</text>
  <text x="440" y="86" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8.5">TouchOSC / Max / Pd / TD</text>
  <text x="440" y="98" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="8">UDP port 9000 · rosc (Rust)</text>

  <!-- Preset -->
  <rect x="540" y="55" width="140" height="50" rx="5" fill="rgba(255,220,80,0.08)" stroke="rgba(255,220,80,0.35)" stroke-width="1"/>
  <text x="610" y="72" text-anchor="middle" fill="rgba(255,220,80,0.9)" font-size="10" font-weight="700">PRESET LOAD</text>
  <text x="610" y="86" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8.5">JSON snapshot</text>
  <text x="610" y="98" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="8">localStorage</text>

  <!-- Arrows down to DOM -->
  <line x1="100" y1="105" x2="100" y2="155" stroke="#ff4444" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="270" y1="105" x2="270" y2="155" stroke="rgba(180,100,255,0.8)" stroke-width="1.5" marker-end="url(#a2b)"/>
  <line x1="440" y1="105" x2="440" y2="155" stroke="rgba(0,200,220,0.8)" stroke-width="1.5" marker-end="url(#a2c)"/>
  <line x1="610" y1="105" x2="440" y2="155" stroke="rgba(255,220,80,0.6)" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- MIDI path annotation -->
  <text x="280" y="133" fill="rgba(180,100,255,0.5)" font-size="8">Tauri "midi-event"</text>
  <text x="450" y="133" fill="rgba(0,200,220,0.5)" font-size="8">Tauri "osc-message"</text>

  <!-- DOM ELEMENT box -->
  <rect x="180" y="155" width="360" height="52" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="360" y="177" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11" font-weight="700">DOM ELEMENT  (input / checkbox)</text>
  <text x="360" y="196" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="9">e.g.  els.corrupt.value = "0.35"   ← all inputs converge here</text>

  <!-- Arrow DOM → draw() -->
  <line x1="360" y1="207" x2="360" y2="247" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- p5 draw() box -->
  <rect x="200" y="247" width="320" height="52" rx="6" fill="rgba(255,68,68,0.1)" stroke="#ff4444" stroke-width="1.5"/>
  <text x="360" y="268" text-anchor="middle" fill="#ff4444" font-size="11" font-weight="700">p5 draw()  loop</text>
  <text x="360" y="285" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="9">reads els.* on every requestAnimationFrame tick</text>

  <!-- Arrow draw → effect -->
  <line x1="360" y1="299" x2="360" y2="335" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Effect output box -->
  <rect x="200" y="335" width="320" height="44" rx="6" fill="rgba(80,255,140,0.06)" stroke="rgba(80,255,140,0.35)" stroke-width="1"/>
  <text x="360" y="355" text-anchor="middle" fill="rgba(80,255,140,0.85)" font-size="11" font-weight="700">Effect chain executes</text>
  <text x="360" y="371" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="9">applyGlitch() · applyTrails() · applyFlowWarp() ···</text>

  <!-- Key insight annotation -->
  <rect x="30" y="247" width="155" height="60" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="107" y="265" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="8.5" font-weight="700">KEY INSIGHT</text>
  <text x="107" y="280" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8">No debounce.</text>
  <text x="107" y="292" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8">No smoothing layer.</text>
  <text x="107" y="304" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8">Next frame = live value.</text>
</svg>
