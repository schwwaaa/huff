[package]
name = "huff_native_wgpu_engine"
version = "0.7.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
cc = "1.2"

[dependencies]
bytemuck = { version = "1.24", features = ["derive", "min_const_generics"] }
cpal = "=0.15.3"
midir = "=0.11.0"
pollster = "0.4"
rfd = "0.17"
rosc = "=0.11.4"
rustfft = "=6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["unstable"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=29.0.4", features = ["vulkan-portability"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-native", "decoding"] }
wgpu = "=29.0.4"

[workspace]
