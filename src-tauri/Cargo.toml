# Keep HUFF Classic isolated from unrelated Cargo workspaces in parent directories.
[workspace]

[package]
name = "huff"
version = "1.0.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }
cmake = "0.1"

[dependencies]
tauri = { version = "1", features = [ "dialog-save", "dialog-open", "wry", "dialog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = "0.21"
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
once_cell = "1"
midir = "0.9"
rosc  = "0.10"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]


[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"
objc_id = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
